<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Detalles de Ventas</title>
</head>
<body>
    <h1>Listado de Detalles de Venta</h1>
    <a href="{% url 'crear_venta_detalle' %}"><button>Nuevo Detalle</button></a>
    
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Producto</th>
                <th>Cantidad</th>
                <th>Precio</th>
            </tr>
        </thead>
        <tbody>
            {% for detalle in detalles %}
            <tr>
                <td>{{ detalle.id }}</td>
                <td>{{ detalle.producto }}</td>
                <td>{{ detalle.cantidad }}</td>
                <td>${{ detalle.precio }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4">No hay detalles de venta registrados.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
